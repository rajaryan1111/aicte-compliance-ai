name: Backend tests

on:
  push:
    branches: ["main", "research/grounded-foundation"]
  pull_request:
    branches: ["main", "research/grounded-foundation"]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run backend tests
        run: python -m pytest -q

  optional-ocr-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/requirements-ocr.txt
      - name: Install Tesseract system engine
        run: |
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr tesseract-ocr-eng
      - name: Install test and optional OCR dependencies
        run: python -m pip install -r backend/requirements-dev.txt -r backend/requirements-ocr.txt
      - name: Run synthetic OCR engine smoke test
        run: python -m pytest -q backend/tests/test_ocr_engine_integration.py
