# Render deployment configuration for AICTE Compliance AI Backend
# https://docs.render.com/infrastructure-as-code

services:
  - type: web
    name: aicte-compliance-api-preview
    runtime: python
    region: oregon
    plan: free
    rootDir: .
    buildCommand: |
      pip install -r backend/requirements.txt
      python -m alembic -c backend/alembic.ini upgrade head
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aicte-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: CORS_ALLOWED_ORIGIN
        value: https://aicte-compliance-ai.vercel.app

databases:
  - name: aicte-db
    plan: free
    region: oregon
    databaseName: aicte_compliance
