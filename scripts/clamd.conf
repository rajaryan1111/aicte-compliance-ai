# Minimal clamd configuration for the single-service container.
# TCP on loopback only: the API and worker reach clamd at 127.0.0.1:3310 and
# nothing outside the container can (the port is not published).
TCPSocket 3310
TCPAddr 127.0.0.1
User clamav
DatabaseDirectory /var/lib/clamav
Foreground true
LogTime true
LogFile /dev/stdout
LogVerbose false
